<script>
/* ---------- Icône + manifest PWA générés à la volée (aucun fichier externe) ---------- */
(function () {
  function drawIcon(size) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#6E9BFF'); g.addColorStop(1, '#3D6BE8');
    x.fillStyle = '#0A0C0F'; x.fillRect(0, 0, size, size);
    x.fillStyle = g;
    var r = size * 0.2, p = size * 0.14, w = size - p * 2;
    x.beginPath(); x.roundRect ? x.roundRect(p, p + size * 0.06, w, w - size * 0.12, r) : x.rect(p, p, w, w); x.fill();
    x.fillStyle = 'rgba(255,255,255,.18)';
    x.fillRect(p, size * 0.36, w, size * 0.07);
    x.fillStyle = '#fff';
    x.font = '700 ' + Math.round(size * 0.34) + 'px ui-rounded, -apple-system, system-ui, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('€', size / 2, size * 0.6);
    return c.toDataURL('image/png');
  }
  try {
    var i180 = drawIcon(180), i512 = drawIcon(512);
    document.getElementById('touch-icon').href = i180;
    document.getElementById('fav-icon').href = i180;
    var start = location.href.split('#')[0];
    var manifest = {
      name: 'Poche — Finances', short_name: 'Poche', lang: 'fr',
      start_url: start, scope: start.replace(/[^/]*$/, ''),
      display: 'standalone', orientation: 'portrait',
      background_color: '#0A0C0F', theme_color: '#0A0C0F',
      icons: [{ src: i180, sizes: '180x180', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
    };
    document.getElementById('manifest-link').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  } catch (e) {}
})();
</script>

<style>

    color-scheme: dark;
    --bg: #0A0C0F;
    --surface: #14171C;
    --surface-2: #1D2127;
    --surface-3: #262B33;

    --accent: #5B8CFF;

    --neg: #FF7466;
    --warn: #F5B84B;
    --radius: 18px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;

  html.standalone { --sat: env(safe-area-inset-top, 0px); }

  body {

  [hidden] { display: none !important; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); }

  #app { min-height: 100%; padding-top: var(--sat); padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px); }

  .view-title { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }

  .card { background: var(--surface); border-radius: var(--radius); }

  .amount .cur { font-size: .5em; color: var(--muted); margin-left: .12em; font-weight: 500; }
  .amount .sign { color: var(--muted); font-weight: 500; margin-right: .05em; }

  /* Puces */
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); font-size: 13.5px; font-weight: 500; color: var(--ink-2); position: relative; white-space: nowrap; max-width: 100%; }
  .chip svg { width: 15px; height: 15px; flex: none; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .cats::-webkit-scrollbar { display: none; }
  .cats.wrapgrid { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); margin: 0; padding: 0; overflow: visible; }
  .cat { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 2px; border-radius: 14px; scroll-snap-align: start; }
  .cat .ico { width: 48px; height: 48px; border-radius: 16px; transition: box-shadow .15s, transform .12s; }

  .cat.sel span { color: var(--ink); font-weight: 600; }

  /* Pavé numérique */

  .key.fn { background: transparent; color: var(--ink-2); }
  .btn-primary { width: 100%; height: 56px; border-radius: 16px; background: var(--accent); color: #fff; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary svg { width: 20px; height: 20px; }
  .btn-primary:disabled { background: var(--surface-2); color: var(--muted); }
  .btn { height: 48px; border-radius: 14px; background: var(--surface-2); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; padding-inline: 16px; }
  .btn svg { width: 18px; height: 18px; }
  .btn.danger { color: var(--neg); }
  .btn.danger.armed { background: var(--neg); color: #fff; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Historique */
  .day-head { display: flex; justify-content: space-between; padding: 18px 4px 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); }
  .badge.warn { background: #3a2e14; color: var(--warn); }
  .row .title { font-weight: 500; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .row .sub svg { width: 12px; height: 12px; }
  .row .amt { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; font-size: 16px; }
  .chev { color: var(--muted); width: 18px; height: 18px; flex: none; }

  /* KPI */

  select.input { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 8px; }
  .swatch { aspect-ratio: 1; border-radius: 50%; max-width: 44px; }
  .swatch.sel { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4.5px var(--ink); }
  .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
  .icon-pick { aspect-ratio: 1; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); max-width: 56px; }
  .icon-pick svg { width: 20px; height: 20px; }
  .icon-pick.sel { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .switch { width: 51px; height: 31px; border-radius: 999px; background: var(--surface-3); position: relative; flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .switch.on { background: var(--pos); }
  .switch.on::after { transform: translateX(20px); }

  /* Toast */
  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px); z-index: 80; display: flex; justify-content: center; pointer-events: none; }
  .toast { pointer-events: auto; max-width: 528px; width: 100%; background: var(--surface-3); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.45); transform: translateY(20px); opacity: 0; transition: all .25s ease; font-size: 14px; }
  .toast.show { transform: none; opacity: 1; }
  .toast svg { width: 18px; height: 18px; color: var(--pos); flex: none; }
  .toast button { margin-left: auto; color: var(--accent); font-weight: 600; padding: 4px 6px; }

  .chart-box { position: relative; }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .empty { text-align: center; color: var(--muted); padding: 36px 20px; font-size: 14px; }
  .empty svg { width: 36px; height: 36px; margin: 0 auto 10px; opacity: .6; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
'use strict';
/* =====================================================================
   POCHE — finances personnelles 100 % locales
   Stockage : IndexedDB (stores : accounts, categories, transactions,
   recurrings, meta). Montants stockés en centimes (entiers).
   ===================================================================== */

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 9));
const EUR = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
const EUR0 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const money = c => EUR.format((c || 0) / 100);
const signed = c => (c > 0 ? '+ ' : c < 0 ? '− ' : '') + EUR.format(Math.abs(c || 0) / 100);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const curMonth = () => todayStr().slice(0, 7);
const addMonths = (m, n) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const daysIn = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const monthLabel = m => { const [y, mo] = m.split('-').map(Number); const s = new Date(y, mo - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); return s[0].toUpperCase() + s.slice(1); };
const monthShort = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('fr-FR', { month: 'short' }).replace('.', ''); };
const dayLabel = s => {
  const t = todayStr(), y = ymd(new Date(Date.now() - 864e5));
  if (s === t) return "Aujourd'hui"; if (s === y) return 'Hier';
  const [yy, mm, dd] = s.split('-').map(Number);
  const l = new Date(yy, mm - 1, dd).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  return l[0].toUpperCase() + l.slice(1);
};
const shortDate = s => { if (s === todayStr()) return "Aujourd'hui"; if (s === ymd(new Date(Date.now() - 864e5))) return 'Hier'; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); };
const toCents = s => { const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) : 0; };

/* ---------- IndexedDB ---------- */
const STORES = ['accounts', 'categories', 'transactions', 'recurrings'];
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('IndexedDB indisponible'));
    const r = indexedDB.open('poche-finances', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Base bloquée'));
  });
}
const idb = {
  req(store, mode, fn) {
    if (!db) return Promise.resolve(null);
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all: s => idb.req(s, 'readonly', o => o.getAll()),
  put: (s, v) => idb.req(s, 'readwrite', o => o.put(v)),
  del: (s, id) => idb.req(s, 'readwrite', o => o.delete(id)),
  replaceAll(data) {
    if (!db) return Promise.resolve();
    return new Promise((res, rej) => {
      const t = db.transaction([...STORES, 'meta'], 'readwrite');
      STORES.forEach(s => { const o = t.objectStore(s); o.clear(); (data[s] || []).forEach(v => o.put(v)); });
      t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
};

/* ---------- Calculs ---------- */
function balances(upTo = todayStr()) {
  const m = new Map(S.accounts.map(a => [a.id, a.initial || 0]));
  for (const t of S.transactions) {
    if (t.date > upTo) continue;
    if (t.type === 'expense') m.set(t.accountId, (m.get(t.accountId) || 0) - t.amount);
    else if (t.type === 'income') m.set(t.accountId, (m.get(t.accountId) || 0) + t.amount);
    else if (t.type === 'transfer') {
      m.set(t.accountId, (m.get(t.accountId) || 0) - t.amount);
      m.set(t.toAccountId, (m.get(t.toAccountId) || 0) + t.amount);
    }
  }
  return m;
}
const globalBalance = (upTo) => { const b = balances(upTo); return S.accounts.reduce((s, a) => s + (b.get(a.id) || 0), 0); };
const inAcc = (t, acc) => acc === 'all' || t.accountId === acc || (t.type === 'transfer' && t.toAccountId === acc);
function monthTotals(month, acc = 'all') {
  let exp = 0, inc = 0;
  for (const t of S.transactions) {
    if (t.date.slice(0, 7) !== month || t.type === 'transfer') continue;
    if (acc !== 'all' && t.accountId !== acc) continue;
    if (t.type === 'expense') exp += t.amount; else inc += t.amount;
  }
  return { exp, inc };
}
/* Montant signé d'une opération vue depuis un compte (ou tous) */
function txSigned(t, acc = 'all') {
  if (t.type === 'expense') return -t.amount;
  if (t.type === 'income') return t.amount;
  if (acc === 'all') return 0;
  return t.toAccountId === acc ? t.amount : -t.amount;
}

/* ---------- Opérations récurrentes ---------- */
async function runRecurrings({ silent = false } = {}) {
  const cur = curMonth(); let created = 0;
  for (const r of S.recurrings) {
    if (!r.active) continue;
    let m = r.lastGenerated ? addMonths(r.lastGenerated, 1) : r.startMonth || cur;
    let changed = false;
    while (m <= cur) {
      const exists = S.transactions.some(t => t.recurringId === r.id && t.date.slice(0, 7) === m);
      const accOk = accById(r.accountId) && (r.type !== 'transfer' || accById(r.toAccountId));
      if (!exists && accOk) {
        const day = Math.min(r.day, daysIn(m));
        await save('transactions', {
          id: uid(), type: r.type, amount: r.amount, accountId: r.accountId,
          toAccountId: r.type === 'transfer' ? r.toAccountId : null,
          categoryId: r.type === 'transfer' ? null : r.categoryId,
          date: `${m}-${pad(day)}`, note: r.label, recurringId: r.id, createdAt: Date.now()
        });
        created++;
      }
      r.lastGenerated = m; m = addMonths(m, 1); changed = true;
    }
    if (changed) await save('recurrings', r);
  }
  await setMeta('lastRecurringRun', todayStr());
  if (created && !silent) toast(`${created} opération${created > 1 ? 's' : ''} récurrente${created > 1 ? 's' : ''} ajoutée${created > 1 ? 's' : ''} pour ${monthLabel(cur).toLowerCase()}`, { icon: 'repeat' });
  return created;
}

  $('#sheets').appendChild(wrap);

  wrap.querySelector('.sheet-backdrop').onclick = close;
  wrap.querySelector('[data-close]').onclick = close;
  // Glisser vers le bas pour fermer
  const sheet = wrap.querySelector('.sheet'); let y0 = null;
  wrap.querySelector('.sheet-grab').parentElement.addEventListener('touchstart', e => { if (e.target.closest('.sheet-body') && wrap.querySelector('.sheet-body').scrollTop > 0) return; y0 = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchmove', e => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; if (dy > 0 && !e.target.closest('input,textarea,select')) { sheet.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; } }, { passive: true });
  sheet.addEventListener('touchend', e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; sheet.style.transition = ''; sheet.style.transform = ''; if (dy > 110) close(); });
  onMount && onMount(wrap.querySelector('.sheet-body'), close);

  return close;
}

  }
  UI.amount = s; refreshAmount();
}

/* =====================================================================
   VUE 2 — HISTORIQUE
   ===================================================================== */
function txRowHTML(t, acc = 'all') {
  const a = accById(t.accountId), to = accById(t.toAccountId);
  const c = catById(t.categoryId);
  const amt = txSigned(t, acc);
  const future = t.date > todayStr();
  let icon, title, sub;
  if (t.type === 'transfer') {
    icon = icoHTML('arrow-left-right', '#9AA6B8'); title = t.note && !t.recurringId ? t.note : 'Virement interne';
    sub = `${esc(a?.name || '?')} → ${esc(to?.name || '?')}`;
  } else {
    icon = icoHTML(c?.icon || 'tag', c?.color || '#9AA6B8'); title = c?.name || 'Sans catégorie';
    sub = `${t.note ? esc(t.note) + ' · ' : ''}${esc(a?.name || '?')}`;
  }
  const cls = t.type === 'transfer' && acc === 'all' ? 'muted' : amt > 0 ? 'pos' : '';
  const shown = t.type === 'transfer' && acc === 'all' ? money(t.amount) : signed(amt);
  return `<button class="row" data-tx="${t.id}">${icon}
    <div class="flex-1 min-w-0"><p class="title">${esc(title)}</p><p class="sub">${t.recurringId ? '<i data-lucide="repeat"></i>' : ''}${sub}</p></div>
    <div class="text-right flex flex-col items-end gap-0.5"><span class="amt ${cls}">${shown}</span>${future ? '<span class="badge warn">Prévu</span>' : ''}</div>
  </button>`;
}
function renderHistory(v) {
  const list = S.transactions.filter(t => t.date.slice(0, 7) === UI.histMonth && inAcc(t, UI.histAcc))
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  const mt = monthTotals(UI.histMonth, UI.histAcc);
  const days = new Map(); list.forEach(t => { if (!days.has(t.date)) days.set(t.date, []); days.get(t.date).push(t); });

  v.innerHTML = `
  <header class="view-head">
    <h1 class="view-title mb-3">Historique</h1>
    ${monthSwitcher('histMonth')}
    ${accFilterHTML('histAcc')}
  </header>
  <div class="kpis mt-2">
    <div class="kpi"><small>Revenus</small><b class="pos">${money(mt.inc)}</b></div>
    <div class="kpi"><small>Dépenses</small><b class="neg">${money(mt.exp)}</b></div>
    <div class="kpi"><small>Solde du mois</small><b class="${mt.inc - mt.exp < 0 ? 'neg' : ''}">${signed(mt.inc - mt.exp)}</b></div>
  </div>
  ${list.length ? [...days].map(([d, arr]) => {
    const net = arr.reduce((s, t) => s + (t.type === 'transfer' ? 0 : txSigned(t)), 0);
    return `<div class="day-head"><span>${dayLabel(d)}</span><span class="num">${net ? signed(net) : ''}</span></div><div class="group">${arr.map(t => txRowHTML(t, UI.histAcc)).join('')}</div>`;
  }).join('') : `<div class="empty"><i data-lucide="receipt"></i><p>Aucune opération en ${monthLabel(UI.histMonth).toLowerCase()}.</p></div>`}
  `;
  bindCommon(v);
  $$('[data-tx]', v).forEach(b => b.onclick = () => openTxSheet(S.transactions.find(t => t.id === b.dataset.tx)));
}
function openTxSheet(t) {

  openSheet({
    title: "Modifier l'opération", body: '<div id="txf"></div>',
    onMount(body, close) {
      const box = $('#txf', body);
      const draw = () => {
        box.innerHTML = `<div class="flex flex-col gap-4">
          <div class="seg">${[['expense', 'Dépense'], ['income', 'Revenu'], ['transfer', 'Virement']].map(([k, l]) => `<button class="tap ${st.type === k ? 'on' : ''}" data-type="${k}">${l}</button>`).join('')}</div>
          <label class="field"><span>Montant (€)</span><input class="input num" id="f-amt" inputmode="decimal" value="${esc(st.amountStr)}"></label>
          ${st.type === 'transfer' ? `
            <div class="grid grid-cols-2 gap-2"><label class="field"><span>De</span><select class="input" id="f-acc">${accOptions(st.accountId)}</select></label>
            <label class="field"><span>Vers</span><select class="input" id="f-to">${accOptions(st.toAccountId, st.accountId)}</select></label></div>`
          : `<div class="field"><span>Catégorie</span>${catGridHTML(st.type, st.categoryId, true)}</div>
             <label class="field"><span>Compte</span><select class="input" id="f-acc">${accOptions(st.accountId)}</select></label>`}
          <div class="grid grid-cols-2 gap-2">
            <label class="field"><span>Date</span><input class="input" type="date" id="f-date" value="${st.date}"></label>
            <label class="field"><span>Note</span><input class="input" id="f-note" maxlength="80" value="${esc(st.note || '')}"></label>
          </div>
          ${st.recurringId ? `<p class="text-[13px] muted flex gap-2 items-center"><i data-lucide="repeat" style="width:14px;height:14px"></i>Générée par une opération récurrente.</p>` : ''}
          <button class="btn-primary tap" id="f-save"><i data-lucide="check"></i>Enregistrer</button>
          <button class="btn danger tap" id="f-del"><i data-lucide="trash-2"></i>Supprimer l'opération</button>
        </div>`;
        icons();
        const sync = () => { st.amountStr = $('#f-amt', box).value; st.accountId = $('#f-acc', box).value; const to = $('#f-to', box); if (to) st.toAccountId = to.value; st.date = $('#f-date', box).value; st.note = $('#f-note', box).value; };
        $$('[data-type]', box).forEach(b => b.onclick = () => { sync(); if (st.type !== b.dataset.type) { st.type = b.dataset.type; st.categoryId = null; if (st.type === 'transfer' && (!st.toAccountId || st.toAccountId === st.accountId)) st.toAccountId = sortedAccounts().find(a => a.id !== st.accountId)?.id; } draw(); });
        $$('[data-cat]', box).forEach(b => b.onclick = () => { st.categoryId = b.dataset.cat; $$('[data-cat]', box).forEach(x => x.classList.toggle('sel', x === b)); haptic(); });
        const acc = $('#f-acc', box); if (st.type === 'transfer') acc.onchange = () => { sync(); if (st.toAccountId === st.accountId) st.toAccountId = sortedAccounts().find(a => a.id !== st.accountId)?.id; draw(); };
        $('#f-save', box).onclick = async () => {
          sync(); const amount = toCents(st.amountStr);
          if (!amount || amount < 0) return toast('Montant invalide', { icon: 'triangle-alert' });
          if (st.type !== 'transfer' && !st.categoryId) return toast('Choisissez une catégorie', { icon: 'triangle-alert' });
          if (st.type === 'transfer' && (!st.toAccountId || st.toAccountId === st.accountId)) return toast('Choisissez deux comptes différents', { icon: 'triangle-alert' });
          const out = { ...t, type: st.type, amount, accountId: st.accountId, toAccountId: st.type === 'transfer' ? st.toAccountId : null, categoryId: st.type === 'transfer' ? null : st.categoryId, date: st.date || t.date, note: st.note.trim() };
          await save('transactions', out); close(); render(); toast('Opération modifiée');
        };
        armConfirm($('#f-del', box), 'Toucher à nouveau pour supprimer', async () => { await remove('transactions', t.id); close(); render(); toast('Opération supprimée', { icon: 'trash-2' }); });
      };

    }

/* =====================================================================

let charts = [];
const destroyCharts = () => { charts.forEach(c => c.destroy()); charts = []; };
function renderStats(v) {

  const months = Array.from({ length: 6 }, (_, i) => addMonths(m, i - 5));

    <div class="kpi"><small>Revenus</small><b class="pos">${money(mt.inc)}</b></div>

  <p class="section-label">Répartition des dépenses</p>
  <div class="card p-4">
    ${rows.length ? `
      <div class="chart-box mx-auto" style="max-width:240px;aspect-ratio:1">
        <canvas id="donut" aria-label="Répartition des dépenses par catégorie" role="img"></canvas>
        <div class="donut-center"><span class="text-[12px] muted">Total</span><span class="num font-semibold text-[22px]">${EUR0.format(mt.exp / 100)}</span></div>
      </div>
      <div class="flex flex-col gap-3 mt-5">
        ${rows.map(r => { const pct = mt.exp ? r.v / mt.exp * 100 : 0; return `
          <div class="flex items-center gap-3">${icoHTML(r.c.icon, r.c.color)}
            <div class="flex-1 min-w-0"><div class="flex justify-between gap-2 text-[14.5px]"><span class="truncate">${esc(r.c.name)}</span><span class="num font-semibold whitespace-nowrap">${money(r.v)}</span></div>
            <div class="flex items-center gap-2 mt-1.5"><div class="bar-track flex-1"><div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${r.c.color}"></div></div><span class="text-[12px] muted num w-10 text-right">${Math.round(pct)} %</span></div></div>
          </div>`; }).join('')}
      </div>` : `<div class="empty"><i data-lucide="chart-pie"></i><p>Aucune dépense ce mois-ci.</p></div>`}
  </div>

  <p class="section-label">Revenus et dépenses sur 6 mois</p>
  <div class="card p-4">
    <div class="chart-box" style="height:220px"><canvas id="bars" role="img" aria-label="Revenus et dépenses des 6 derniers mois"></canvas></div>
    <div class="flex gap-4 justify-center mt-3 text-[12.5px] muted">

      <span class="flex items-center gap-1.5"><span class="dot" style="width:9px;height:9px;border-radius:3px;background:var(--neg)"></span>Dépenses</span>

  </div>`;
  bindCommon(v);

  if (!window.Chart) return;
  const css = getComputedStyle(document.documentElement);

  Chart.defaults.color = tok('--muted');

  if (rows.length) {
    charts.push(new Chart($('#donut'), {
      type: 'doughnut',
      data: { labels: rows.map(r => r.c.name), datasets: [{ data: rows.map(r => r.v / 100), backgroundColor: rows.map(r => r.c.color), borderColor: tok('--surface'), borderWidth: 3, hoverOffset: 6, borderRadius: 4 }] },

  charts.push(new Chart($('#bars'), {
    type: 'bar',

      { label: 'Dépenses', data: series.map(s => s.exp / 100), backgroundColor: tok('--neg'), borderRadius: 6, maxBarThickness: 18 }
    ] },

}

  <div class="field"><span>Icône</span><div class="icon-grid">${ICONS.map(i => `<button class="icon-pick tap ${i === icon ? 'sel' : ''}" data-icon="${i}" aria-label="${i}"><i data-lucide="${i}"></i></button>`).join('')}</div></div>`;
}
function bindPickers(box, st, onChange) {

  $$('[data-icon]', box).forEach(b => b.onclick = () => { st.icon = b.dataset.icon; $$('[data-icon]', box).forEach(x => x.classList.toggle('sel', x === b)); onChange(); });

          <button class="btn-primary tap" id="r-save"><i data-lucide="check"></i>${r ? 'Enregistrer' : 'Créer'}</button>
          ${r ? `<button class="btn danger tap" id="r-del"><i data-lucide="trash-2"></i>Supprimer (les opérations passées restent)</button>` : ''}
        </div>`;
        icons();
        const sync = () => { st.label = $('#r-label', box).value; st.amountStr = $('#r-amt', box).value; st.day = +$('#r-day', box).value; st.accountId = $('#r-acc', box).value; const to = $('#r-to', box); if (to) st.toAccountId = to.value; };

    }

}

/* ---------- Export / Import ---------- */
function buildExport() {
  return { app: 'poche-finances', version: 1, exportedAt: new Date().toISOString(), accounts: S.accounts, categories: S.categories, transactions: S.transactions, recurrings: S.recurrings };
}
function exportData() {
  const json = JSON.stringify(buildExport(), null, 2);
  const name = `poche-sauvegarde-${todayStr()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  const canShare = navigator.canShare && navigator.canShare({ files: [file] });
  openSheet({
    title: 'Exporter mes données',
    body: `<div class="flex flex-col gap-3">
      <p class="text-[14px] muted">${S.accounts.length} comptes · ${S.categories.length} catégories · ${S.transactions.length} opérations · ${S.recurrings.length} récurrentes</p>
      ${canShare ? `<button class="btn-primary tap" id="x-share"><i data-lucide="share"></i>Enregistrer dans Fichiers…</button>` : ''}
      <button class="${canShare ? 'btn' : 'btn-primary'} tap" id="x-dl"><i data-lucide="download"></i>Télécharger ${esc(name)}</button>
      <button class="btn tap" id="x-copy"><i data-lucide="copy"></i>Copier le JSON</button>
      <textarea class="input" id="x-json" readonly>${esc(json)}</textarea>
      <p class="text-[12.5px] muted">Si le téléchargement ne démarre pas (aperçu intégré, par exemple), copiez le JSON et collez-le dans une note ou un fichier.</p>
    </div>`,
    onMount(box) {
      const sh = $('#x-share', box); if (sh) sh.onclick = () => navigator.share({ files: [file], title: 'Sauvegarde Poche' }).catch(() => {});
      $('#x-dl', box).onclick = () => { try { const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); setMeta('lastExport', todayStr()); } catch (e) { toast('Téléchargement impossible ici : copiez le JSON', { icon: 'triangle-alert' }); } };
      $('#x-copy', box).onclick = () => { const ta = $('#x-json', box); (navigator.clipboard ? navigator.clipboard.writeText(json) : Promise.reject()).then(() => toast('JSON copié')).catch(() => { ta.focus(); ta.select(); toast('Texte sélectionné : copiez-le manuellement', { icon: 'info' }); }); };
    }
  });
}
function validateImport(d) {
  if (!d || typeof d !== 'object') throw new Error('Fichier illisible');
  if (!Array.isArray(d.accounts) || !Array.isArray(d.categories) || !Array.isArray(d.transactions)) throw new Error("Ce fichier n'est pas une sauvegarde Poche");
  if (!d.accounts.length) throw new Error('La sauvegarde ne contient aucun compte');
  const okId = x => x && typeof x.id === 'string';
  if (![...d.accounts, ...d.categories, ...d.transactions, ...(d.recurrings || [])].every(okId)) throw new Error('Des éléments sans identifiant ont été trouvés');
  if (!d.transactions.every(t => Number.isInteger(t.amount) && /^\d{4}-\d{2}-\d{2}$/.test(t.date))) throw new Error('Des opérations ont un montant ou une date invalide');
  return { accounts: d.accounts, categories: d.categories, transactions: d.transactions, recurrings: d.recurrings || [] };
}
function importSheet() {
  let parsed = null;
  openSheet({
    title: 'Importer mes données',
    body: `<div class="flex flex-col gap-3">
      <p class="text-[14px] muted">L'import remplace toutes les données actuelles de l'app par celles de la sauvegarde.</p>
      <label class="btn tap" style="position:relative;overflow:hidden"><i data-lucide="file-json"></i>Choisir un fichier .json<input type="file" id="i-file" accept="application/json,.json" style="position:absolute;inset:0;opacity:0"></label>
      <label class="field"><span>Ou collez le contenu JSON</span><textarea class="input" id="i-text" placeholder='{"app":"poche-finances", …}'></textarea></label>
      <div id="i-sum" class="text-[14px]"></div>
      <button class="btn-primary tap" id="i-go" disabled><i data-lucide="upload"></i>Remplacer mes données</button>
    </div>`,
    onMount(box, close) {
      const go = $('#i-go', box), sum = $('#i-sum', box);
      const check = txt => {
        try { parsed = validateImport(JSON.parse(txt)); sum.innerHTML = `<p class="pos">Sauvegarde valide : ${parsed.accounts.length} comptes, ${parsed.categories.length} catégories, ${parsed.transactions.length} opérations, ${parsed.recurrings.length} récurrentes.</p>`; go.disabled = false; }
        catch (e) { parsed = null; go.disabled = true; sum.innerHTML = txt.trim() ? `<p class="neg">${esc(e.message === 'Unexpected end of JSON input' || e instanceof SyntaxError ? 'JSON invalide : vérifiez que le texte est complet.' : e.message)}</p>` : ''; }
      };
      $('#i-file', box).onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#i-text', box).value = r.result; check(r.result); }; r.readAsText(f); };
      $('#i-text', box).oninput = e => check(e.target.value);
      armConfirm(go, 'Toucher à nouveau : les données actuelles seront remplacées', async () => {
        if (!parsed) return;
        await idb.replaceAll(parsed);
        STORES.forEach(s => S[s] = parsed[s]);
        UI.acc = defaultAcc()?.id; UI.cat = null;
        await setMeta('welcomeDismissed', true);
        await runRecurrings({ silent: true });
        close(); render(); toast('Données restaurées');
      });
    }
  });
}

  openSheet({

/* ---------- Données d'exemple ---------- */
async function loadSample() {
  const byName = n => S.categories.find(c => c.name === n)?.id || S.categories.find(c => c.type === 'expense')?.id;
  const perso = defaultAcc(), vac = S.accounts.find(a => a.name.includes('Vacances')) || sortedAccounts()[1];
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const today = todayStr(); const out = [];
  const push = (type, amount, cat, date, extra = {}) => { if (date <= today) out.push({ id: uid(), type, amount, accountId: perso.id, toAccountId: null, categoryId: cat ? byName(cat) : null, date, note: '', recurringId: null, createdAt: Date.now() + out.length, sample: true, ...extra }); };
  if (!perso.initial) await save('accounts', { ...perso, initial: 185000 });
  for (let k = -4; k <= 0; k++) {
    const m = addMonths(curMonth(), k), dim = daysIn(m), d = n => `${m}-${pad(Math.min(n, dim))}`;
    push('income', 245000, null, d(1), { categoryId: S.categories.find(c => c.name === 'Salaire')?.id });
    push('expense', 78000, 'Logement', d(3), { note: 'Loyer' });
    push('expense', 1599, 'Abonnements', d(5), { note: 'Streaming' });
    if (vac) push('transfer', 20000, null, d(2), { toAccountId: vac.id });
    const plan = [['Courses', 5, 2500, 9000], ['Repas extérieur', 4, 1200, 3800], ['Sorties', 2, 1500, 4500], ['Transport', 3, 1500, 6000], ['Vêtements', 1, 2500, 8000], ['Loisirs', 1, 1000, 4000]];
    for (const [cat, n, lo, hi] of plan) for (let j = 0; j < n; j++) push('expense', Math.round((lo + rnd() * (hi - lo)) / 10) * 10, cat, d(1 + Math.floor(rnd() * dim)));
  }
  for (const t of out) await save('transactions', t);
  await setMeta('welcomeDismissed', true);
  render(); toast(`${out.length} opérations d'exemple ajoutées · retirez-les dans Réglages`, { icon: 'flask-conical', ms: 4500 });
}

$$('.tabbar [data-tab]').forEach(b => b.onclick = () => {
  haptic();
  if (UI.tab === b.dataset.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  UI.tab = b.dataset.tab; window.scrollTo(0, 0); render();
});
/* Clavier physique (ordinateur) pour la saisie */
document.addEventListener('keydown', e => {
  if (UI.tab !== 'entry' || $('#sheets').children.length || e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey) return;
  if (/^[0-9]$/.test(e.key)) pressKey(e.key);
  else if (e.key === ',' || e.key === '.') pressKey(',');
  else if (e.key === 'Backspace') pressKey('del');
  else if (e.key === 'Enter') submitEntry();
  else return;
  e.preventDefault();
});

/* ---------- Démarrage ---------- */
async function boot() {
  if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
  try { db = await openDB(); } catch (e) { db = null; }
  if (db) {
    const [accounts, categories, transactions, recurrings, meta] = await Promise.all([...STORES, 'meta'].map(s => idb.all(s)));
    Object.assign(S, { accounts, categories, transactions, recurrings });
    (meta || []).forEach(m => S.meta[m.key] = m.value);
  }
  if (!S.accounts.length) {
    const seed = seedDefaults();
    for (const a of seed.accounts) await save('accounts', a);
    if (!S.categories.length) for (const c of seed.categories) await save('categories', c);
  }
  UI.acc = defaultAcc()?.id;
  await runRecurrings();
  render();
  if (!db) toast("Stockage indisponible : les données ne seront pas conservées", { icon: 'triangle-alert', ms: 6000 });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  // Nouveau mois pendant que l'app était en arrière-plan
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible') return;
    if (S.meta.lastRecurringRun !== todayStr()) { const n = await runRecurrings(); if (UI.date < todayStr() && !UI.amount) UI.date = todayStr(); if (n || UI.tab === 'entry') render(); }
  });
  // Service Worker (hors ligne) : uniquement quand l'app est servie en http(s) avec sw.js à côté
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
</body>
